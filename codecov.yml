# Codecov configuration for modbus-trace-explorer.
# CI uploads two reports: the Go profile of the packages `make coverage-check`
# measures (flag unittests; the Wails shell needs a window) and the frontend's
# Vitest lcov report (flag frontend), whose paths are relative to frontend/.
fixes:
  - "src/app/::frontend/src/app/"

flags:
  unittests:
    carryforward: true
  frontend:
    carryforward: true
    paths:
      - frontend/src/

coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 70%
